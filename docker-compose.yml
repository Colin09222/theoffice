services:
  theoffice:
    build: .
    container_name: theoffice
    restart: unless-stopped
    env_file: .env
    # The contractor ping reaches buddehbot's gateway over the tailnet. hz runs tailscale with --accept-dns=false, so the name is pinned here and TLS still checks it.
    extra_hosts:
      - "buddehbot-mac.tail2f5032.ts.net:100.123.213.72"
    environment:
      HOST: 0.0.0.0
      PORT: "8083"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8083:8083"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - ./data:/data
      # office-runner, Phase 2. Directories, so a runner restart's new socket shows up here. Not there yet? Docker makes them empty and server slots stay off.
      - /run/office-runner/api:/run/office-runner/api:ro
      - /opt/office-runner/shared:/opt/office-runner/shared:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 700m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
