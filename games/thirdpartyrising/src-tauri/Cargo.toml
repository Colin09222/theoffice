[package]
name = "third-party-rising"
version = "0.1.0"
edition = "2021"
description = "Third Party Rising: desktop shell (Tauri). The game logic lives in crates/sim."
license = "UNLICENSED"

# A workspace of its own, so `cargo test` in the parent never needs a webview toolchain.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tpr-sim = { path = "../crates/sim" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
